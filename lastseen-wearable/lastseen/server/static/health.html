<!doctype html>
<html><head><meta charset="utf-8"><title>Last Seen - health</title>
<style>body{font-family:sans-serif;background:#111;color:#eee;padding:16px}
.r{padding:6px 10px;margin:4px 0;border-radius:4px}.g{background:#1b5e20}.b{background:#b71c1c}</style></head>
<body><h1>Health</h1><div id="rows"></div>
<script>
async function tick(){
  try{
    const j=await (await fetch('/health')).json();
    const el=document.getElementById('rows');el.innerHTML='';
    for(const [k,v] of Object.entries(j)){
      const d=document.createElement('div');
      d.className='r '+((v===null||v===false||v===0)?'b':'g');
      d.textContent=k+': '+JSON.stringify(v);el.appendChild(d);
    }
  }catch(e){document.getElementById('rows').textContent='unreachable';}
}
tick();setInterval(tick,2000);
</script></body></html>
