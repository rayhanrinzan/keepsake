<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#050505">
<link rel="manifest" href="/manifest.json">
<title>Last Seen</title>
<style>
  :root { --bg:#050505; --fg:#f5f5f0; --dim:#b8b8b0; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg); overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
  .screen { position:absolute; inset:0; padding:0 16px; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center;
    opacity:0; visibility:hidden; transition:opacity .35s ease, visibility 0s linear .35s; }
  .screen.on { opacity:1; visibility:visible; transition:opacity .35s ease; }
  #clock { font-size:min(24vw, 40vh); font-weight:300; line-height:1; letter-spacing:-.02em; }
  #clock small { font-size:.28em; font-weight:400; margin-left:.15em; color:var(--dim); letter-spacing:0; }
  #date { font-size:5vw; margin-top:3vh; color:var(--dim); }
  @media (orientation:portrait) { #date { font-size:7vw; } }
  #answer { padding:0; background:#000; }
  #answer img, #answer video { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; background:#000; }
  #answer video { display:none; }
  #answer.vid video { display:block; }
  #band { position:absolute; left:0; right:0; bottom:0; padding:12vh 16px 4vh; text-align:center;
    background:linear-gradient(to top, rgba(0,0,0,.92) 0%, rgba(0,0,0,.8) 55%, rgba(0,0,0,0) 100%); }
  #answer.noimg #band { position:static; background:none; padding:0 16px; }
  #name { font-size:min(10vw, 16vh); font-weight:700; line-height:1.05; margin:0; }
  #text { font-size:4.5vw; line-height:1.25; margin:1.5vh 0 0; }
  @media (orientation:portrait) { #text { font-size:6vw; } #name { font-size:13vw; } }
  #answer.noimg #name { display:none; }
  #answer.noimg #text { font-size:7vw; margin:0; }
  #answer.alert { box-shadow: inset 0 0 0 1.2vw #e0342b; }
  #dot { position:fixed; top:10px; right:10px; width:10px; height:10px; border-radius:50%;
    background:#555; opacity:.8; z-index:5; }
  #dot.ok { background:#2e7d4f; }
</style></head>
<body>
<div id="dot"></div>
<div id="idle" class="screen on"><div id="clock"></div><div id="date"></div></div>
<div id="answer" class="screen">
  <img id="snap" alt="">
  <video id="clip" muted loop autoplay playsinline webkit-playsinline preload="auto"></video>
  <div id="band"><p id="name"></p><p id="text"></p></div>
</div>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var idle = $("idle"), ans = $("answer"), snap = $("snap"), clip = $("clip");
  var IDLE_MS = 60000, idleTimer = null;

  function tick() {
    var d = new Date(), h = d.getHours(), m = d.getMinutes();
    $("clock").innerHTML = ((h % 12) || 12) + ":" + (m < 10 ? "0" : "") + m + "<small>" + (h < 12 ? "AM" : "PM") + "</small>";
    $("date").textContent = d.toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric" });
  }
  tick(); setInterval(tick, 5000);

  function showIdle() {
    ans.classList.remove("on");
    idle.classList.add("on");
    setTimeout(function () {
      if (!ans.classList.contains("on")) { try { clip.pause(); } catch (e) {} clip.removeAttribute("src"); clip.load(); }
    }, 500);
  }

  function nice(id) {
    return String(id || "").replace(/_+/g, " ").trim();
  }

  function showAnswer(a) {
    clearTimeout(idleTimer);
    var hasImg = !!(a.snapshot_url && a.item_id);
    ans.classList.toggle("noimg", !hasImg);
    ans.classList.remove("vid");
    $("name").textContent = a.display_name || nice(a.item_id);
    $("text").textContent = a.text || "";
    if (hasImg) {
      snap.style.display = "block";
      snap.src = a.snapshot_url;
    } else {
      snap.style.display = "none"; snap.removeAttribute("src");
    }
    try { clip.pause(); } catch (e) {}
    clip.removeAttribute("src"); clip.load();
    if (hasImg && a.clip_url) {
      clip.onerror = function () { ans.classList.remove("vid"); };
      clip.oncanplay = function () {
        if (clip.getAttribute("src") === a.clip_url) ans.classList.add("vid");
      };
      clip.muted = true;
      clip.src = a.clip_url;
      var p = clip.play(); if (p && p.catch) p.catch(function () {});
    }
    idle.classList.remove("on");
    ans.classList.add("on");
    idleTimer = setTimeout(showIdle, IDLE_MS);
  }

  var delay = 1000;
  function connect() {
    var ws;
    try {
      ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws");
    } catch (e) { return retry(); }
    ws.onopen = function () { delay = 1000; $("dot").className = "ok"; };
    ws.onmessage = function (ev) {
      var m; try { m = JSON.parse(ev.data); } catch (e) { return; }
      if (m && m.type === "show_answer" && m.answer) showAnswer(m.answer);
    };
    ws.onclose = function () { $("dot").className = ""; retry(); };
    ws.onerror = function () { try { ws.close(); } catch (e) {} };
  }
  function retry() {
    setTimeout(connect, delay);
    delay = Math.min(delay * 2, 5000);
  }
  connect();
})();
</script>
</body></html>
