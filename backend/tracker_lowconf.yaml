# ByteTrack tuned for YOLO-World, whose scores are much lower than COCO models.
# The stock bytetrack.yaml ignores anything under 0.25, which hides most YOLO-World detections.
tracker_type: bytetrack
track_high_thresh: 0.1
track_low_thresh: 0.05
new_track_thresh: 0.1
track_buffer: 30
match_thresh: 0.8
fuse_score: True
